name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Check tag matches package.json
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

      - name: Package VSIX
        run: npx --yes @vscode/vsce@latest package --out "hellcat-theme-${GITHUB_REF_NAME}.vsix"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: hellcat-theme-${{ github.ref_name }}.vsix
          generate_release_notes: true
